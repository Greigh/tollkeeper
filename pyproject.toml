[project]
name = "tollkeeper"
version = "0.2.0"
description = "A local-first, cost-aware router for AI coding subscriptions and metered APIs"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Tollkeeper Contributors" }]
keywords = ["ai", "router", "claude", "cursor", "openrouter", "cost-tracking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx2>=2.12.0", "httpx>=0.28.1", "pytest>=8"]
build = ["pyinstaller>=6.0"]


[project.urls]
Homepage = "https://github.com/coding-router/coding-router"
Documentation = "https://github.com/coding-router/coding-router/blob/main/HOW_TO_USE.md"
Repository = "https://github.com/coding-router/coding-router"

[project.scripts]
router = "router.cli:main"
router-app = "router.app.api:main_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "config.example.toml"
"HOW_TO_USE.md" = "HOW_TO_USE.md"
"DESIGN_DOC.md" = "DESIGN_DOC.md"
"BUILD_TIMELINE.md" = "BUILD_TIMELINE.md"

[tool.pyright]
venvPath = "."
venv = ".venv"
